[workspace]
resolver = "2"
members = [
  "crates/*",
  "doppler",
  "examples",
  "packages/cli/tests/integration",
  "packages/cli/tests/integration/sdk-harness",
  "program",
  "sdk/rust",
]

[workspace.package]
repository = "https://github.com/blueshift-gg/doppler"
readme = "README.md"
license-file = "LICENSE"
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
doppler = { path = "./doppler" }
doppler-program = { path = "./program" }
doppler-sdk = { path = "./sdk/rust" }
mollusk-svm = "0.13.1"
mollusk-svm-bencher = "0.13.1"
serde = { version = "1.0.219" }
solana-account = { version = "3.4" }
solana-client = { version = "3.0" }
solana-clock = { version = "3.0" }
solana-compute-budget-interface = { version = "3.0" }
solana-hash = { version = "4.2" }
solana-instruction = { version = "3.2" }
solana-keypair = { version = "3.1" }
solana-program = { version = "2.3.0" }
solana-pubkey = { version = "4.1" }
solana-sdk-ids = { version = "3.1" }
solana-signer = { version = "3.0" }
solana-system-interface = { version = "3.1", features = ["bincode"] }
solana-transaction = { version = "3.0", features = ["bincode"] }
solana-message = { version = "3.1" }
solana-commitment-config = { version = "3.1" }
futures = { version = "0.3" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
bs58 = "0.5"
thiserror = "2.0"
anyhow = "1.0"
bincode = "1.3"
indexmap = { version = "2", features = ["serde"] }
solana-loader-v3-interface = { version = "6.1", features = ["bincode"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
