[workspace]
resolver = "2"
members = [
  "doppler",
  "examples",
  "generator/tests/integration",
  "generator/tests/integration/sdk-harness",
  "program",
  "sdk/rust",
]

[workspace.package]
repository = "https://github.com/blueshift-gg/doppler"
readme = "README.md"
license-file = "LICENSE"
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
doppler = { path = "./doppler" }
doppler-program = { path = "./program" }
doppler-sdk = { path = "./sdk/rust" }
mollusk-svm = "0.13.1"
mollusk-svm-bencher = "0.13.1"
serde = { version = "1.0.219" }
solana-account = "3.4"
solana-client = "3.0"
solana-clock = "3.0"
solana-compute-budget-interface = "3.0"
solana-hash = "4.2"
solana-instruction = "3.2"
solana-keypair = "3.1"
solana-pubkey = "4.1"
solana-sdk-ids = "3.1"
solana-signer = "3.0"
solana-system-interface = { version = "3.1", features = ["bincode"] }
solana-transaction = { version = "3.0", features = ["bincode"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
