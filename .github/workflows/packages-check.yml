name: Packages check

on:
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
  push:
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run packages:check
