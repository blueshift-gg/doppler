name: TypeScript SDK check

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
  push:
    paths:
      - "sdk/typescript/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
